name: Toon thumbs

on:
  push:
    branches: [main]
    paths: [".github/toon-thumb-list.txt"]

permissions:
  contents: write

jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get pictures
        run: |
          pip install -q pillow
          python3 - <<'PY'
          import os, io, time, urllib.request
          from PIL import Image
          ok, bad = 0, []
          for line in open(".github/toon-thumb-list.txt"):
              if not line.strip(): continue
              name, url = line.split()
              out = f"thumb/toon/{name}.webp"
              if os.path.exists(out): ok += 1; continue
              done = False
              for t in range(4):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      im = Image.open(io.BytesIO(urllib.request.urlopen(req, timeout=30).read())).convert("RGBA")
                      bg = Image.new("RGBA", im.size, (255, 255, 255, 255)); bg.alpha_composite(im)
                      bg.convert("RGB").save(out, "WEBP", quality=85, method=6); done = True; break
                  except Exception as e:
                      print("retry", name, e); time.sleep(4)
              if done: ok += 1
              else: bad.append(name)
              time.sleep(0.5)
          print("ok", ok, "bad", bad)
          PY
      - name: Save
        run: |
          git config user.name "lego-minifig1"
          git config user.email "329362638+lego-minifig1@users.noreply.github.com"
          git add thumb/toon
          git commit -q -m "Update files" || exit 0
          git pull -q --rebase || true
          git push
