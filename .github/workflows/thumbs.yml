name: Make thumbs
on:
  push:
    branches: [thumb-work]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: make-thumbs
  cancel-in-progress: false
jobs:
  thumbs:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Make pictures
        run: |
          pip install -q pillow
          python3 -u .github/thumbs/$(cat .github/thumbs/_mode 2>/dev/null || echo make).py
