<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없어요 · 레고 미니피규어 도감 모음</title>
<link rel="icon" href="/lego-minifig/favicon.png" type="image/png">
<style>
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#16274a;color:#f4efe2;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;text-align:center;padding:24px;box-sizing:border-box}
.card{max-width:420px}
.brick{width:84px;height:84px;margin:0 auto 22px;border-radius:18px;background:#d62828;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;box-sizing:border-box}
.brick i{border-radius:50%;background:#f05446;box-shadow:0 3px 0 #96161a}
h1{font-size:24px;margin:0 0 10px;font-weight:600}
p{margin:0 0 26px;color:#c9d1e6;line-height:1.7;font-size:15.5px}
a{display:inline-block;padding:13px 26px;border-radius:999px;background:#ffcf3a;color:#2a2118;text-decoration:none;font-weight:600;font-size:16px}
a:focus-visible{outline:3px solid #fff;outline-offset:3px}
small{display:block;margin-top:28px;color:#8d99b8;font-size:13px}
</style>
</head>
<body>
<div class="card">
  <div class="brick" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <h1>찾는 페이지가 없어요</h1>
  <p>주소가 바뀌었거나 잘못 들어온 것 같아요.<br>도감 모음에서 다시 찾아보세요.</p>
  <a href="/lego-minifig/">도감 모음으로 가기</a>
  <small>마가렛트 제작</small>
</div>
</body>
</html>
