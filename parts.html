<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-sOQO/bGQupGbEaZHLtCm72Q2oZyjeH3SVxpyq7Hc7Ig='; style-src 'unsafe-inline'; img-src https://img.bricklink.com data:; font-src https://cdn.jsdelivr.net; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>재미로 보는 레고 부품 도감</title>
<style>
@font-face{font-family:'Cafe24Ssurround';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/Cafe24Ssurround.woff') format('woff');font-weight:normal;font-display:swap}
@font-face{font-family:'Pretendard';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Pretendard';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Pretendard';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'memomentKkukKkuk';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2508-2@1.0/memomentKkukKkuk.woff2') format('woff2');font-weight:normal;font-display:swap}

:root{
  --wall:#2c3646; --wall-hole:#1d2430;
  --frame:#f3f4f2; --frame-dk:#d9dcd8; --frame-sh:#b9bdb8;
  --label:#ffffff; --ink:#1f2a44; --sub:#68707c;
  --hand:"memomentKkukKkuk","Malgun Gothic",cursive;
  --title:"Cafe24Ssurround","Malgun Gothic",sans-serif;
  --sans:"Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;
  --g:#3da35a; --g-lt:#bfe7c9; --g-dk:#23753b;
  --r:#e0483e; --r-lt:#f8c6c1; --r-dk:#a92a22;
  --b:#2e7fd6; --b-lt:#bcd8f6; --b-dk:#1d5aa0;
  --y:#f4b81c; --y-lt:#fbe6a6; --y-dk:#b98307;
  --c:var(--g); --c-lt:var(--g-lt); --c-dk:var(--g-dk);
}
body[data-tab=weapon]{--c:var(--r);--c-lt:var(--r-lt);--c-dk:var(--r-dk)}
body[data-tab=prop]{--c:var(--b);--c-lt:var(--b-lt);--c-dk:var(--b-dk)}
body[data-tab=head]{--c:var(--y);--c-lt:var(--y-lt);--c-dk:var(--y-dk)}
*{box-sizing:border-box}
html{background:var(--wall)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;background:var(--wall);
  background-image:radial-gradient(circle at 12px 12px,var(--wall-hole) 3px,transparent 3.6px),radial-gradient(circle at 12px 13px,rgba(255,255,255,.06) 3px,transparent 3.6px);
  background-size:24px 24px;min-height:100vh}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}

/* ===== 정리함 위쪽 ===== */
.cab{max-width:1240px;margin:22px auto 0;padding:0 20px}
.cab-in{background:var(--frame);border-radius:14px 14px 0 0;padding:18px 22px 0;
  box-shadow:inset 0 -2px 0 var(--frame-dk),0 10px 0 var(--frame-sh),0 18px 30px rgba(0,0,0,.35);position:relative}
.top{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.title{display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-family:var(--title);font-weight:400;font-size:42px;line-height:1.05;color:var(--ink);letter-spacing:-.5px;
  display:flex;flex-direction:column;background:#f6e7a8;padding:10px 24px 12px;transform:rotate(-2deg);align-self:flex-start;
  box-shadow:0 2px 0 #e2cf7e,2px 5px 10px rgba(0,0,0,.18);
  clip-path:polygon(1.5% 4%,98% 0,100% 92%,97% 100%,2% 97%,0 48%)}
.count{font-size:13px;color:var(--sub);padding-left:4px}
.count b{color:var(--c-dk)}
.mini{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;justify-self:end;width:min(520px,100%)}
.mini i{display:block;height:22px;border-radius:3px;position:relative;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 45%),var(--m);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 1px 0 rgba(0,0,0,.1)}
.mini i::after{content:"";position:absolute;left:30%;right:30%;bottom:4px;height:3px;border-radius:2px;background:rgba(0,0,0,.28)}
.search{display:flex;gap:8px;margin-top:16px}
.search input,.search select{background:#fff;border:2px solid var(--frame-dk);border-radius:8px;padding:9px 12px;font-size:14px}
.search input{flex:1;min-width:0}
.search input:focus{border-color:var(--c)}

h1 small{font-family:var(--hand);font-size:19px;line-height:1;color:var(--r-dk);letter-spacing:0;margin-bottom:4px}
/* 서랍 = 탭 */
nav button .slot .sm{display:none}
nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px;padding-bottom:16px}
nav button{--d:var(--g);--d-dk:var(--g-dk);position:relative;border:0;cursor:pointer;border-radius:8px;
  padding:14px 10px 22px;display:flex;flex-direction:column;align-items:center;gap:5px;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.08) 40%,rgba(0,0,0,.06)),var(--d);
  box-shadow:inset 0 -6px 0 var(--d-dk),0 3px 0 rgba(0,0,0,.18);transition:transform .18s ease,box-shadow .18s ease}
nav button[data-t=weapon]{--d:var(--r);--d-dk:var(--r-dk)}
nav button[data-t=prop]{--d:var(--b);--d-dk:var(--b-dk)}
nav button[data-t=head]{--d:var(--y);--d-dk:var(--y-dk)}
nav button .slot{background:#fff;border-radius:3px;padding:3px 16px 0;min-width:72%;
  font-family:var(--hand);font-size:21px;line-height:1.35;color:var(--ink);box-shadow:inset 0 0 0 2px rgba(0,0,0,.12)}
nav button small{font-size:12px;color:#fff;font-weight:500;text-shadow:0 1px 1px rgba(0,0,0,.3)}
nav button::after{content:"";position:absolute;left:50%;bottom:9px;width:46px;height:8px;margin-left:-23px;border-radius:4px;
  background:rgba(0,0,0,.25);box-shadow:inset 0 2px 2px rgba(0,0,0,.25)}
nav button:not(.on):hover{transform:translateY(2px)}
nav button.on{transform:translateY(12px) scale(1.02);box-shadow:inset 0 -6px 0 var(--d-dk),0 16px 20px rgba(0,0,0,.35)}
nav button.on .slot{box-shadow:inset 0 0 0 2px var(--d-dk)}

/* ===== 서랍 속 ===== */
main{max-width:1240px;margin:0 auto;padding:0 20px 70px}
.tray{background:var(--c-lt);border-radius:0 0 14px 14px;padding:22px 18px 22px;
  box-shadow:inset 0 14px 18px -10px rgba(0,0,0,.35),0 18px 30px rgba(0,0,0,.35);transition:background .25s}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chips button{border:0;background:rgba(255,255,255,.7);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;
  box-shadow:0 1px 0 rgba(0,0,0,.12)}
.chips button small{color:var(--sub);margin-left:4px;font-size:12px}
.chips button:hover{background:#fff}
.chips button.on{background:var(--c-dk);color:#fff;font-weight:700}
.chips button.on small{color:rgba(255,255,255,.8)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{position:relative;cursor:pointer;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;
  background:linear-gradient(180deg,#ffffff 0%,#f6f8fa 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 4px 0 var(--c-dk),0 8px 14px rgba(0,0,0,.18);transition:transform .15s ease}
.card:hover{transform:translateY(-3px)}
.pic{height:140px;display:flex;align-items:center;justify-content:center;padding:14px 10px 6px;position:relative;
  background:radial-gradient(ellipse at 50% 78%,rgba(0,0,0,.08),transparent 60%)}
.pic img{max-width:86%;max-height:116px;object-fit:contain;filter:drop-shadow(0 4px 3px rgba(0,0,0,.2))}
.lip{background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0) 30%),var(--c);
  padding:8px 8px 10px;flex:1;display:flex}
.info{background:var(--label);border-radius:4px;padding:8px 10px 7px;display:flex;flex-direction:column;gap:3px;flex:1;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 1px 0 rgba(0,0,0,.15)}
.ko{font-weight:700;font-size:13.5px;line-height:1.3;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.en{font-size:11.5px;color:var(--sub);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.set{font-size:12px;color:#4a5566;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{margin-top:auto;padding-top:5px;font-size:11.5px;color:var(--sub);display:flex;justify-content:space-between;align-items:center;gap:6px}
.yr{font-family:var(--hand);font-size:15px;line-height:1.2;color:#fff;background:var(--c-dk);border-radius:999px;padding:3px 10px 2px}
.price{font-size:12.5px;font-weight:700;color:var(--c-dk)}
.tags{display:flex;flex-wrap:wrap;gap:3px}
.tags span{font-size:11px;border-radius:999px;padding:0 7px;background:var(--c-lt);color:var(--ink)}
.more{display:block;margin:24px auto 0;padding:11px 30px;border:0;border-radius:999px;background:var(--c-dk);color:#fff;cursor:pointer;font-weight:700;
  box-shadow:0 4px 0 rgba(0,0,0,.25)}
.more:hover{filter:brightness(1.08)}
.empty{padding:60px 0;text-align:center;color:var(--ink);font-family:var(--hand);font-size:22px}

/* 꺼낸 칸 */
dialog{border:0;border-radius:14px;padding:0;max-width:520px;width:92vw;background:#fff;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(20,26,36,.65)}
.dl .big{height:270px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 80%,rgba(0,0,0,.09),transparent 60%),linear-gradient(180deg,#fff,#f3f5f7)}
.dl .big img{max-width:86%;max-height:240px;filter:drop-shadow(0 6px 5px rgba(0,0,0,.2))}
.dl .body{background:var(--c);padding:12px 14px 16px;background-image:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 30%)}
.dl .card2{background:#fff;border-radius:6px;padding:12px 14px}
.dl h2{font-size:18px;margin:0 0 6px;color:var(--ink)}
.dl table{width:100%;border-collapse:collapse;font-size:14px}
.dl td{padding:6px 2px;border-bottom:1px dashed #dde1e6;vertical-align:top}
.dl tr:last-child td{border-bottom:0}
.dl td:first-child{color:var(--sub);width:92px;white-space:nowrap}
.dl a{color:var(--c-dk);font-weight:700}
.dl .x{position:absolute;top:10px;right:12px;border:0;background:rgba(255,255,255,.9);width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.2)}

@media (max-width:760px){
  .cab{margin-top:12px;padding:0 10px}
  .cab-in{padding:14px 12px 0}
  .top{grid-template-columns:1fr}
  .mini{display:none}
  h1{font-size:31px;padding:8px 18px 10px}
  h1 small{font-size:15px}
  .search select{max-width:42%}
  nav{gap:6px}
  nav button{padding:10px 3px 18px}
  nav button .slot .lg{display:none}
  nav button .slot .sm{display:inline}
  nav button .slot{font-size:15px;padding:3px 3px 1px;white-space:nowrap;min-width:0;max-width:100%;overflow:hidden}
  main{padding:0 10px 50px}
  .tray{padding:16px 8px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .pic{height:118px}
}
@media (prefers-reduced-motion:reduce){nav button,.card,.tray{transition:none}}

.foot{text-align:center;color:rgba(255,255,255,.55);font-size:12.5px;padding:0 0 40px}
/* ===== 보강 ===== */
.tray{position:relative;padding-top:34px}
.studs{position:absolute;left:18px;right:18px;top:8px;height:16px;
  background:radial-gradient(circle at 12px 8px,rgba(255,255,255,.75) 0 2.5px,transparent 3px),
             radial-gradient(circle at 12px 8px,var(--c) 0 7px,transparent 7.5px),
             radial-gradient(circle at 12px 10px,var(--c-dk) 0 7px,transparent 7.5px);
  background-size:24px 16px;background-repeat:repeat-x;opacity:.9}

.pick{display:grid;grid-template-columns:240px 1fr;gap:22px;align-items:center;margin:0 0 20px;
  background:#fff;border-radius:14px;padding:16px 22px 16px 16px;position:relative;overflow:hidden;
  box-shadow:0 5px 0 var(--c-dk),0 12px 22px rgba(0,0,0,.18)}
.pick::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--c-lt);opacity:.7}
.pk-pic{height:190px;border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;
  background:radial-gradient(ellipse at 50% 85%,rgba(0,0,0,.12),transparent 60%),repeating-linear-gradient(45deg,var(--c-lt) 0 10px,#fff 10px 20px)}
.pk-pic img{max-width:84%;max-height:170px;filter:drop-shadow(0 8px 6px rgba(0,0,0,.25));transform:rotate(-4deg)}
.pk-txt{position:relative}
.pk-tag{display:inline-block;font-family:var(--hand);font-size:18px;line-height:1.2;color:#fff;background:var(--c-dk);padding:5px 12px 4px;border-radius:4px;transform:rotate(-2deg)}
.pick h2{margin:10px 0 6px;font-size:22px;line-height:1.3;color:var(--ink)}
.pick p{margin:0 0 14px;color:var(--sub);max-width:60ch}
.pk-btns{display:flex;gap:8px;flex-wrap:wrap}
.pk-btns button{border:0;border-radius:999px;padding:8px 18px;cursor:pointer;font-weight:700;background:var(--c-dk);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.22)}
.pk-btns button.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--c-dk),0 3px 0 rgba(0,0,0,.12)}

.row2{display:flex;gap:12px;align-items:flex-end;margin:-4px 0 18px;flex-wrap:wrap}
.decades{display:flex;gap:4px;align-items:flex-end;flex:1;min-width:0;overflow-x:auto;padding-bottom:2px}
.decades button{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 4px;min-width:50px}
.decades .bar{display:block;width:30px;height:calc(6px + var(--h) * 34px);border-radius:5px 5px 2px 2px;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 50%),var(--c);opacity:.45;transition:opacity .15s}
.decades button[data-d=all] .bar{height:12px;background:var(--ink);opacity:.25}
.decades b{font-size:12.5px;font-weight:500;color:var(--ink)}
.decades small{font-size:11px;color:var(--sub);margin-top:-3px}
.decades button:hover .bar{opacity:.75}
.decades button.on .bar{opacity:1;box-shadow:0 0 0 2px #fff}
.decades button.on b{font-weight:700}
.favbtn{border:0;border-radius:999px;padding:7px 14px;background:rgba(255,255,255,.75);cursor:pointer;font-size:14px;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.favbtn::before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:#d6dadf;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.favbtn.on{background:var(--ink);color:#fff}
.favbtn.on::before{background:var(--r)}

.fav{position:absolute;z-index:2;top:9px;left:9px;width:24px;height:24px;border-radius:50%;border:0;cursor:pointer;padding:0;
  background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.8) 0 3px,transparent 3.5px),#dfe3e8;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),0 1px 2px rgba(0,0,0,.2);opacity:.75;transition:transform .12s,opacity .12s}
.card:hover .fav,.fav:focus-visible{opacity:1}
.fav:hover{transform:scale(1.12)}
.fav.on{opacity:1;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.7) 0 3px,transparent 3.5px),var(--r);box-shadow:inset 0 -3px 0 var(--r-dk),0 1px 3px rgba(0,0,0,.3)}
.big-fav{top:14px;left:14px;width:32px;height:32px}

img[data-no]{opacity:0;transition:opacity .25s ease}
img[data-no].ok{opacity:1}
.card:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

dialog{position:fixed}
.dl{position:relative}
.dl .big{position:relative}
.nav-btn{position:absolute;top:50%;margin-top:-22px;width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;
  background:var(--c);color:#fff;font-size:30px;line-height:1;padding-bottom:4px;box-shadow:inset 0 -4px 0 var(--c-dk),0 3px 8px rgba(0,0,0,.25)}
.nav-btn.prev{left:12px}.nav-btn.next{right:12px}
dialog[data-tab=animal]{--c:var(--g);--c-lt:var(--g-lt);--c-dk:var(--g-dk)}
dialog[data-tab=weapon]{--c:var(--r);--c-lt:var(--r-lt);--c-dk:var(--r-dk)}
dialog[data-tab=prop]{--c:var(--b);--c-lt:var(--b-lt);--c-dk:var(--b-dk)}
dialog[data-tab=head]{--c:var(--y);--c-lt:var(--y-lt);--c-dk:var(--y-dk)}
.mates{margin-top:12px}
.mates span{font-size:12.5px;color:var(--sub)}
.mates div{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px}
.mates button{flex:0 0 auto;width:56px;height:56px;border-radius:8px;border:0;background:#f2f4f6;cursor:pointer;padding:4px;box-shadow:inset 0 0 0 1px #e1e5ea}
.mates button:hover{box-shadow:inset 0 0 0 2px var(--c)}
.mates img{max-width:100%;max-height:100%;object-fit:contain}
.bl{margin:12px 0 0;font-size:13px}

.totop{position:fixed;right:22px;bottom:22px;z-index:6;width:58px;height:58px;border-radius:12px;border:0;cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0) 45%),var(--c);color:#fff;font-weight:700;font-size:13px;
  box-shadow:inset 0 -5px 0 var(--c-dk),0 8px 16px rgba(0,0,0,.35);opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .2s,transform .2s}
.totop::before{content:"";position:absolute;left:50%;top:-9px;width:24px;height:12px;margin-left:-12px;border-radius:5px 5px 0 0;background:var(--c);box-shadow:inset 0 3px 0 rgba(255,255,255,.4)}
.totop.show{opacity:1;pointer-events:auto;transform:none}

@media (max-width:760px){
  .pick{grid-template-columns:112px 1fr;gap:12px;padding:10px 12px 12px 10px}
  .pk-pic{height:120px}
  .pk-pic img{max-height:100px}
  .pk-tag{font-size:15px}
  .pick h2{font-size:16px;margin:6px 0 4px}
  .pick p{font-size:13px;margin-bottom:10px}
  .pk-btns button{padding:6px 12px;font-size:13px}
  .studs{left:8px;right:8px}
  .row2{flex-direction:column;align-items:stretch}
  .favbtn{align-self:flex-start}
  .totop{right:12px;bottom:12px;width:50px;height:50px}
}
@media (prefers-reduced-motion:reduce){img[data-no],.totop,.fav,.decades .bar{transition:none}}
</style>
</head>
<body>
<header class="cab"><div class="cab-in">
  <div class="top">
    <div class="title"><h1><small>재미로 보는​‌‌​‌‌​​​‌‌​​‌​‌​‌‌​​‌‌‌​‌‌​‌‌‌‌​​‌​‌‌​‌​‌‌​‌‌​‌​‌‌​‌​​‌​‌‌​‌‌‌​​‌‌​‌​​‌​‌‌​​‌‌​​‌‌​‌​​‌​‌‌​​‌‌‌​​‌‌​​​‌​​‌​​​​​​‌‌‌​​​​​‌‌​​​​‌​‌‌‌​​‌​​‌‌‌​‌​​​‌‌‌​​‌‌​​‌​​​​​​​‌‌​​‌​​​‌‌​​​​​​‌‌​​‌​​​‌‌​‌‌​​​‌​‌‌​‌​​‌‌​​​‌​​‌‌​​​​​​‌​‌‌​‌​​‌‌​​‌​​​‌‌​​​‌</small>레고 부품 도감</h1><span class="count" id="count"></span></div>
    <div class="mini" id="mini" aria-hidden="true"></div>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="이름, 부품 번호, 세트로 찾기">
    <select id="sort">
      <option value="year">처음 나온 해 순</option>
      <option value="yearDesc">최근 나온 순</option>
      <option value="name">이름 순</option>
      <option value="no">부품 번호 순</option>
      <option value="priceDesc">비싼 순</option>
